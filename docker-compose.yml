services:
  mysql:
    image: mysql:8.0
    container_name: db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: mydb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  java-api:
    build:
      context: .
      dockerfile: Dockerfile.java
    container_name: db-java-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mydb
      DB_USER: root
      DB_PASSWORD: rootroot
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
